# This file represents the base specification of your challenge. It is used by
# other tools to install and deploy your challenge.

# Required sections
name: "Meowrine Corp"
author: "Karev"

# Select a category from:
# - pwn
# - web
# - osint
# - crypto
# - forensics
# - reverse
# - misc
category: forensics

# This is the challenge description. Make sure you include the
# necessary URLs / netcat strings here.
# Constants:
# {{ IP_SERVER }} to get service IP address
# {{ PORT }} to get service port
description: "
  A hacker recently got access to the computer of a high ranking admiral of the meowrine corp. 
  We managed to kick him out and made sure nothing was stolen. However something weird has been 
  going on over our network now, we want you to figure out what is happening. We suspect it is related to the recent hack 
  so to help you, I've given you the logs during the hack, the network capture, and the admiral's computer logical image. 
  To adhere to protocol, any sensitive documents have been redacted. Good luck."

# Flags specify answers that your challenge use. You should generally provide
# at least one.
# Can be removed if unused
# Accepts strings or dictionaries
flags:
  - COMPFEST17{meow_meow_meow_meow__meow_meow_meow_meow_meoware_e233b7e475}

# Tags are used to classify your challenge with topics. You should provide at
# least one.
# Can be removed if unused
# Accepts strings
tags:
  - evtx
  - pcap
  - ad1

# Hints are used to give players a way to buy or have suggestions. They are not
# required but can be nice.
# Default value: cost = 0, state = "visible"
# Can be removed if unused
# Accepts dictionaries
hints:


# Link to problem attachment for participants
# Can be removed if unused
# Accepts strings
attachment: link_to_attachment

